<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 740" role="img" aria-label="Modern sightline study at station 20 feet. Wall chest: Sample point visible through an open face. Pillar chest: Sample point visible through an open face."><title>Seeing while passing: a modern sightline study</title><desc>Modern sightline study at station 20 feet. Wall chest: Sample point visible through an open face. Pillar chest: Sample point visible through an open face.. Two four-foot square chests and the sample points are illustrative. Closed corner contact blocks. Neighbouring bays and vertical geometry are omitted. Based on selected IG II² 1668 opening-face clauses, Choisy 1884 p.13; this geometry is modern.</desc><metadata>Syngraphe. New diagram: Anthony Mercer, 2026. MIT. Historical text: public domain.</metadata><style>
