name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:model
      - run: npx playwright install --with-deps chromium firefox
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run test:browser -- /tmp/syngraphe-review
      - run: python3 scripts/artifacts.py /tmp/syngraphe-review
      - run: npm run test:faults -- /tmp/syngraphe-faults
